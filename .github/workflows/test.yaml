name: Run Test
on: 
  push: 
    branches: [main,develop]
  pull_request: 
    branches: [main,develop]
jobs: 
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRE_USER: test_user
          POSTGRE_PASWORD: test_password
          POSTGRE_DB: test_db
        ports:
          - 5432:5432
        options:  >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timout 5s
          --health-retries 5
    env:
      DATABASE_URL:postgresql://mehrdad@localhost:5432/messaging_app_db?schema=public
